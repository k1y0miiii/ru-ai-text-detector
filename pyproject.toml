[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aidetector"
version = "1.0.0"
description = "Детектор ИИ-текста на русском: признаки (v1) + дообученные трансформеры (v2/v3/v4)"
readme = "README.md"
# Стек закреплён точными пинами (torch 2.4.1 / sklearn 1.5.2 / numpy 1.26.4) —
# эти версии выпущены до Python 3.13 и не имеют под него колёс; вдобавок модели
# models/*.joblib пиклены sklearn 1.5.2, менять её нельзя. Поэтому верхняя граница <3.13.
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["aidetector"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
